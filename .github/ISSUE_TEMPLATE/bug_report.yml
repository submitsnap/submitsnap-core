name: Bug report
description: Report behavior that differs from the documented or expected result.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include credentials, tokens, or sensitive submission data. Security issues must use private reporting."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Core version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Rust version, deployment method, and relevant non-secret configuration.
